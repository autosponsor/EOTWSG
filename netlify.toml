[build]
  # Build command for Vite apps
  command = "npm run build"
  publish = "dist"

[build.processing]
  [build.processing.css]
    bundle = true
    minify = true
  [build.processing.js]
    bundle = true
    minify = true
  [build.processing.html]
    pretty_urls = true
    minify = true

# Useful headers to increase security. Adjust domains in CSP to match the CDNs/APIs you actually use.
[[headers]]
  for = "/*"
  [headers.values]
    # This policy allows scripts, styles, and images from ANY URL (*), plus inline code.
    Content-Security-Policy = "default-src 'self'; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data: blob:; font-src * data:; connect-src *; frame-src *;"


